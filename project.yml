name: Magneto
options:
  bundleIdPrefix: com.hkabache
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.5
targets:
  Magneto:
    type: application
    platform: macOS
    sources:
      - Magneto
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    # Sparkle ships its helpers ad-hoc signed and expects the app to re-sign them.
    # Xcode only does that through archive + export; a plain `xcodebuild build` signs
    # the framework and leaves its insides ad-hoc, which Apple refuses to notarize.
    # Commands and their order come from Sparkle's own documentation, --deep included
    # in what it tells you not to do.
    postBuildScripts:
      - name: Signer les binaires internes de Sparkle
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          FRAMEWORK="$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/Frameworks/Sparkle.framework"
          if [ ! -d "$FRAMEWORK" ] || [ -z "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            exit 0
          fi
          VERSIONED="$FRAMEWORK/Versions/B"
          SIGN=(codesign -f -s "$EXPANDED_CODE_SIGN_IDENTITY" -o runtime --timestamp)
          "${SIGN[@]}" "$VERSIONED/XPCServices/Installer.xpc"
          "${SIGN[@]}" --preserve-metadata=entitlements "$VERSIONED/XPCServices/Downloader.xpc"
          "${SIGN[@]}" "$VERSIONED/Autoupdate"
          "${SIGN[@]}" "$VERSIONED/Updater.app"
          "${SIGN[@]}" "$FRAMEWORK"
    # Kept out of the sources folder: both targets compile everything under Magneto/,
    # and a plist sitting there would be picked up as a source file.
    info:
      path: Magneto-Info.plist
      properties:
        # XcodeGen writes a literal 1.0 / 1 into any plist it generates, which would
        # win over the build settings and make every release announce itself as 1.0.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The app carries no .lproj, so macOS resolved it to its development language
        # and every dialog Sparkle draws came out in English on a French Mac. Declaring
        # the localization without shipping resources for it is what Sparkle does for
        # its own helper: CFBundleLocalizations is what preferredLocalizationsFromArray
        # matches on, and the framework then picks its fr.lproj. It has to be this key
        # and not CFBundleDevelopmentRegion, which Xcode overwrites from
        # DEVELOPMENT_LANGUAGE whatever the plist says. Left at en on purpose: it is the
        # fallback when nothing matches, so an English Mac keeps Sparkle in English.
        CFBundleLocalizations: [fr]
        SUFeedURL: https://github.com/hkabache/Magneto/releases/latest/download/appcast.xml
        # Public by design: it is what verifies that an update was signed by the
        # private key, and it ships inside every copy of the app.
        SUPublicEDKey: gzuXkr8cMOTG6OeKM/lreNPh/zm6+OVvb/mNnNgGQhA=
        # True rather than left unset: unset makes Sparkle ask on the second launch
        # whether it may check, and someone who never answers that question never gets
        # an update either. Nothing is shown when a check finds something, the popover
        # announces it, see GentleReminders.
        SUEnableAutomaticChecks: true
        # A week. The daily default measures a release cadence this app does not have.
        SUScheduledCheckInterval: 604800
        # Drops the "download and install updates automatically" checkbox from the
        # update window: a version is installed because someone asked for it.
        SUAllowsAutomaticUpdates: false
        # Already the default. Written down because it is the only way Sparkle could
        # send anything about the machine, and the README promises it does not.
        SUEnableSystemProfiling: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hkabache.magneto
        PRODUCT_NAME: Magneto
        MARKETING_VERSION: "0.3.2"
        CURRENT_PROJECT_VERSION: "302"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        # TCC stores a code requirement, not a path: an ad-hoc signature pins it to
        # the binary's cdhash, so every rebuild revoked the microphone and
        # accessibility grants. Signing with an identity anchors the requirement on
        # the certificate instead.
        CODE_SIGN_IDENTITY: "Developer ID Application"
        # Public by nature: it is written into the signature of every binary shipped.
        DEVELOPMENT_TEAM: AQ7LZD44WD
        # Required by notarization, and it closes access to sensitive resources
        # unless the entitlements file opens them.
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_ENTITLEMENTS: Magneto.entitlements
        # Xcode otherwise adds com.apple.security.get-task-allow, which lets a
        # debugger attach and which Apple rejects at notarization.
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        # Notarization demands a secure timestamp on the signature.
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_CFBundleDisplayName: Magneto
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Magneto enregistre le micro pendant la dictée."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Magneto peut transcrire localement via la reconnaissance vocale d'Apple."
    scheme:
      testTargets:
        - MagnetoTests

  MagnetoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MagnetoTests
      # The app is compiled into the test bundle instead of being hosted by it: the
      # hardened runtime forbids the code injection a test host would need, and
      # relaxing it for Debug would break the very signature TCC pins its grants to.
      - path: Magneto
        excludes:
          - MagnetoApp.swift
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hkabache.magneto.tests
        PRODUCT_NAME: MagnetoTests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
