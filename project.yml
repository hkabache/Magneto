name: Magneto
options:
  bundleIdPrefix: com.hkabache
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.0.0
targets:
  Magneto:
    type: application
    platform: macOS
    sources:
      - Magneto
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hkabache.magneto
        PRODUCT_NAME: Magneto
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        # Self-signed certificate from the login keychain. TCC stores a code
        # requirement, not a path: an ad-hoc signature pins it to the binary's
        # cdhash, so every rebuild revoked the microphone and accessibility grants.
        # Signing with an identity anchors the requirement on the certificate.
        CODE_SIGN_IDENTITY: "Magneto Code Signing"
        ENABLE_HARDENED_RUNTIME: false
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_CFBundleDisplayName: Magneto
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Magneto enregistre le micro pendant la dictée."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Magneto peut transcrire localement via la reconnaissance vocale d'Apple."
