name: Release

# Déclenchée par un tag de version, jamais par un push de branche ni par une pull
# request : les secrets de signature ne doivent être accessibles qu'à une release
# volontaire. Ne jamais ajouter pull_request_target ici, ce déclencheur exposerait
# les secrets au code d'un fork.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    # L'attente d'Apple domine la durée du job, la compilation ne prend qu'une minute.
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Déduire la version du tag
        run: |
          set -euo pipefail
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "DMG=Magneto-${GITHUB_REF_NAME#v}.dmg" >> "$GITHUB_ENV"

      - name: Préparer les outils
        run: |
          set -euo pipefail
          brew install --quiet xcodegen
          # Le projet cible macOS 26 : on prend explicitement le Xcode le plus
          # récent de l'image, plutôt que de dépendre de celui qui est par défaut.
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      # Le certificat est importé dans un trousseau créé pour l'occasion, et non
      # dans celui du runner : il disparaît avec la machine, et rien ne subsiste
      # si une étape échoue. Le mot de passe est tiré au sort à chaque exécution,
      # il n'a donc pas à être un secret.
      - name: Installer le certificat de signature
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/magneto.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          P12="$RUNNER_TEMP/certificate.p12"

          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$P12"

          # Sans cette autorisation, codesign resterait bloqué sur une demande
          # d'accès au trousseau, qu'aucun humain ne viendra valider.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Compiler
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild \
            -project Magneto.xcodeproj \
            -scheme Magneto \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

      # Vérifié avant de soumettre : un rejet de notarisation ne dit pas toujours
      # ce qui manque, alors qu'un contrôle local nomme le problème.
      - name: Vérifier la signature de l'app
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/Magneto.app"
          echo "APP=$APP" >> "$GITHUB_ENV"

          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Timestamp"

          if ! codesign -d --verbose=2 "$APP" 2>&1 | grep -q "flags=.*runtime"; then
            echo "::error::runtime durci absent, la notarisation refuserait le paquet"
            exit 1
          fi
          if codesign -d --entitlements - "$APP" 2>&1 | grep -q "get-task-allow"; then
            echo "::error::get-task-allow présent, Apple rejette cet entitlement"
            exit 1
          fi

      - name: Construire et signer le DMG
        run: |
          set -euo pipefail
          STAGING="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create -volname "Magneto" -srcfolder "$STAGING" \
            -ov -format UDZO "$DMG"

          codesign --sign "Developer ID Application" --timestamp "$DMG"
          codesign --verify --verbose=2 "$DMG"

      # Le fichier est envoyé à Apple, qui l'analyse et renvoie un ticket. L'agrafage
      # colle ce ticket au DMG, ce qui permet à Gatekeeper de le valider même sans
      # réseau chez l'utilisateur.
      - name: Notariser et agrafer
        env:
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPSTORE_API_KEY_BASE64" | base64 --decode > "$KEY"
          AUTH=(--key "$KEY" --key-id "$APPSTORE_API_KEY_ID" --issuer "$APPSTORE_API_ISSUER_ID")

          # Soumission et attente séparées, pour disposer de l'identifiant : sans lui,
          # un échec ne laisse aucun moyen de demander à Apple ce qu'il reproche.
          ID=$(xcrun notarytool submit "$DMG" "${AUTH[@]}" --output-format json \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "soumission : $ID"

          # Apple annonce un traitement en quelques minutes, mais une première
          # soumission d'un compte inconnu peut dépasser la demi-heure.
          if ! xcrun notarytool wait "$ID" "${AUTH[@]}" --timeout 55m; then
            echo "::error::notarisation non aboutie, rapport d'Apple ci-dessous"
            xcrun notarytool log "$ID" "${AUTH[@]}" || true
            rm -f "$KEY"
            exit 1
          fi

          rm -f "$KEY"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      # Le verdict que rendra le Mac de l'utilisateur, prononcé ici avant publication.
      - name: Simuler le contrôle Gatekeeper
        run: |
          set -euo pipefail
          MOUNT="$(hdiutil attach "$DMG" -nobrowse -readonly | grep -o '/Volumes/.*')"
          spctl --assess --type execute --verbose=4 "$MOUNT/Magneto.app"
          hdiutil detach "$MOUNT" > /dev/null

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "$DMG" \
            --title "Magneto $VERSION" \
            --generate-notes
