name: Release

# Déclenchée par un tag de version, jamais par un push de branche ni par une pull
# request : les secrets de signature ne doivent être accessibles qu'à une release
# volontaire. Ne jamais ajouter pull_request_target ici, ce déclencheur exposerait
# les secrets au code d'un fork.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    # L'attente d'Apple domine la durée du job, la compilation ne prend qu'une minute.
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      # Épinglée sur la version du paquet SPM : ce sont les outils qui signent le flux
      # que l'app vérifiera avec la clé publique compilée dedans.
      SPARKLE_VERSION: "2.9.5"

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Déduire la version du tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Sans numéro de version dans le nom, ce qui donne au DMG une URL permanente,
          # releases/latest/download/Magneto.dmg, sur laquelle pointe le bouton de
          # téléchargement du README. Le renommer casserait ce bouton en silence, sans
          # rien casser dans la release elle-même, dont le titre porte la version.
          echo "DMG=Magneto.dmg" >> "$GITHUB_ENV"

          # Le numéro de build est ce que Sparkle compare pour décider qu'une version
          # est plus récente. Le dériver du tag plutôt que du compteur d'exécutions,
          # qui repart à 1 si la workflow est un jour renommée : les installations
          # existantes verraient alors la nouveauté comme plus ancienne qu'elles.
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "BUILD=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))" >> "$GITHUB_ENV"

      - name: Préparer les outils
        run: |
          set -euo pipefail
          brew install --quiet xcodegen
          # Le projet cible macOS 26 : on prend explicitement le Xcode le plus
          # récent de l'image, plutôt que de dépendre de celui qui est par défaut.
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

          # sign_update ne fait pas partie du paquet SPM, il vient de la distribution
          # binaire de Sparkle.
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          "$RUNNER_TEMP/sparkle/bin/sign_update" --help > /dev/null

      # Le certificat est importé dans un trousseau créé pour l'occasion, et non
      # dans celui du runner : il disparaît avec la machine, et rien ne subsiste
      # si une étape échoue. Le mot de passe est tiré au sort à chaque exécution,
      # il n'a donc pas à être un secret.
      - name: Installer le certificat de signature
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/magneto.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          P12="$RUNNER_TEMP/certificate.p12"

          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$P12"

          # Sans cette autorisation, codesign resterait bloqué sur une demande
          # d'accès au trousseau, qu'aucun humain ne viendra valider.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Compiler
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild \
            -project Magneto.xcodeproj \
            -scheme Magneto \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            build

      # Avant la notarisation, la seule étape lente : une règle de nettoyage cassée
      # doit coûter une minute, pas une demi-heure d'attente chez Apple.
      - name: Tester
        run: |
          set -euo pipefail
          # Les mêmes surcharges qu'à l'étape Compiler, et pas par confort : le scheme
          # embarque l'app en buildForTesting, donc `test` la recompile. Sans elles les
          # réglages diffèrent, Xcode réécrit l'Info.plist du bundle qui part en DMG, et
          # l'app publiée se déclare à la version de project.yml. Sparkle comparant ce
          # numéro à celui de l'appcast, la mise à jour se reproposerait sans fin.
          xcodebuild test \
            -project Magneto.xcodeproj \
            -scheme Magneto \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD"

      # Vérifié avant de soumettre : un rejet de notarisation ne dit pas toujours
      # ce qui manque, alors qu'un contrôle local nomme le problème.
      - name: Vérifier la signature de l'app
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/Magneto.app"
          echo "APP=$APP" >> "$GITHUB_ENV"

          # Le filet : quelle qu'en soit la cause, une app qui n'annonce pas la version
          # du tag ne doit pas atteindre le DMG. L'appcast, lui, est construit à partir
          # de $VERSION et $BUILD, donc une divergence ici se paie en boucle de mise à
          # jour chez l'utilisateur, sans rien de visible côté release.
          PLIST="$APP/Contents/Info.plist"
          BUILT_SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          BUILT_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          if [ "$BUILT_SHORT" != "$VERSION" ] || [ "$BUILT_BUILD" != "$BUILD" ]; then
            echo "::error::l'app construite annonce $BUILT_SHORT/$BUILT_BUILD au lieu de $VERSION/$BUILD"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Timestamp"

          if ! codesign -d --verbose=2 "$APP" 2>&1 | grep -q "flags=.*runtime"; then
            echo "::error::runtime durci absent, la notarisation refuserait le paquet"
            exit 1
          fi
          if codesign -d --entitlements - "$APP" 2>&1 | grep -q "get-task-allow"; then
            echo "::error::get-task-allow présent, Apple rejette cet entitlement"
            exit 1
          fi

          # Sparkle livre ses helpers en ad-hoc. Une régression du script de resignature
          # ne se verrait qu'au rejet d'Apple, une demi-heure plus tard et sans motif
          # évident : on la nomme ici. Un chemin disparu fait échouer codesign, ce qui
          # est le bon comportement si Sparkle réorganise son framework.
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"
          for nested in \
            "$SPARKLE/XPCServices/Installer.xpc" \
            "$SPARKLE/XPCServices/Downloader.xpc" \
            "$SPARKLE/Autoupdate" \
            "$SPARKLE/Updater.app"; do
            info=$(codesign -dvv "$nested" 2>&1)
            if grep -q "adhoc" <<< "$info"; then
              echo "::error::$(basename "$nested") est reste signe ad-hoc"
              exit 1
            fi
            if ! grep -q "^Timestamp=" <<< "$info"; then
              echo "::error::$(basename "$nested") n'a pas d'horodatage securise"
              exit 1
            fi
          done

      - name: Construire et signer le DMG
        run: |
          set -euo pipefail
          STAGING="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create -volname "Magneto" -srcfolder "$STAGING" \
            -ov -format UDZO "$DMG"

          codesign --sign "Developer ID Application" --timestamp "$DMG"
          codesign --verify --verbose=2 "$DMG"

      # Le fichier est envoyé à Apple, qui l'analyse et renvoie un ticket. L'agrafage
      # colle ce ticket au DMG, ce qui permet à Gatekeeper de le valider même sans
      # réseau chez l'utilisateur.
      - name: Notariser et agrafer
        env:
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPSTORE_API_KEY_BASE64" | base64 --decode > "$KEY"
          AUTH=(--key "$KEY" --key-id "$APPSTORE_API_KEY_ID" --issuer "$APPSTORE_API_ISSUER_ID")

          # Soumission et attente séparées, pour disposer de l'identifiant : sans lui,
          # un échec ne laisse aucun moyen de demander à Apple ce qu'il reproche.
          ID=$(xcrun notarytool submit "$DMG" "${AUTH[@]}" --output-format json \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "soumission : $ID"

          # Apple annonce un traitement en quelques minutes, mais une première
          # soumission d'un compte inconnu peut dépasser la demi-heure.
          if ! xcrun notarytool wait "$ID" "${AUTH[@]}" --timeout 55m; then
            echo "::error::notarisation non aboutie, rapport d'Apple ci-dessous"
            xcrun notarytool log "$ID" "${AUTH[@]}" || true
            rm -f "$KEY"
            exit 1
          fi

          rm -f "$KEY"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      # Le verdict que rendra le Mac de l'utilisateur, prononcé ici avant publication.
      - name: Simuler le contrôle Gatekeeper
        run: |
          set -euo pipefail
          MOUNT="$(hdiutil attach "$DMG" -nobrowse -readonly | grep -o '/Volumes/.*')"
          spctl --assess --type execute --verbose=4 "$MOUNT/Magneto.app"
          hdiutil detach "$MOUNT" > /dev/null

      # Après l'agrafage et jamais avant : agrafer réécrit le DMG, donc une signature
      # calculée plus tôt ne correspondrait plus au fichier que l'app téléchargera,
      # et Sparkle refuserait la mise à jour sans que rien n'ait l'air cassé.
      - name: Construire le flux de mise à jour
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/sparkle_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY"
          # Rend directement les attributs sparkle:edSignature et length de l'enclosure.
          ENCLOSURE=$("$RUNNER_TEMP/sparkle/bin/sign_update" "$DMG" --ed-key-file "$KEY")
          rm -f "$KEY"

          cat > appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
          <channel>
          <title>Magneto</title>
          <item>
          <title>Magneto $VERSION</title>
          <pubDate>$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
          <sparkle:version>$BUILD</sparkle:version>
          <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
          <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
          <enclosure url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$DMG" $ENCLOSURE type="application/octet-stream" />
          </item>
          </channel>
          </rss>
          XML

          # Un flux malformé casserait la mise à jour de tout le monde en silence.
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('appcast.xml')"
          cat appcast.xml

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "$DMG" appcast.xml \
            --title "Magneto $VERSION" \
            --generate-notes
